<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a41">Password + RFID Lock System: Wiring Diagram</text>

  <!-- connection lines -->
  <g stroke="#5b6b82" stroke-width="2.5" fill="none">
    <line x1="270" y1="135" x2="380" y2="260"/>
    <line x1="270" y1="485" x2="380" y2="380"/>
    <line x1="690" y1="120" x2="580" y2="260"/>
    <line x1="690" y1="300" x2="580" y2="330"/>
    <line x1="805" y1="350" x2="805" y2="440"/>
  </g>

  <!-- Arduino Nano -->
  <rect x="380" y="200" width="200" height="240" rx="12" fill="#0b5ed7"/>
  <text x="480" y="300" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Arduino Nano</text>
  <text x="480" y="328" text-anchor="middle" font-size="13" fill="#dbe7ff">Main controller</text>
  <text x="480" y="352" text-anchor="middle" font-size="13" fill="#dbe7ff">Common GND for all parts</text>

  <!-- RC522 -->
  <rect x="40" y="60" width="230" height="150" rx="10" fill="#e8f1ff" stroke="#0b5ed7" stroke-width="2"/>
  <text x="155" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a41">RC522 RFID Reader</text>
  <text x="155" y="116" text-anchor="middle" font-size="14" fill="#1b2a41">SDA → D10     SCK → D13</text>
  <text x="155" y="140" text-anchor="middle" font-size="14" fill="#1b2a41">MOSI → D11    MISO → D12</text>
  <text x="155" y="164" text-anchor="middle" font-size="14" fill="#1b2a41">RST → D9      3.3V → 3V3</text>
  <text x="155" y="188" text-anchor="middle" font-size="14" fill="#1b2a41">GND → GND</text>

  <!-- Keypad -->
  <rect x="40" y="410" width="230" height="150" rx="10" fill="#e8f1ff" stroke="#0b5ed7" stroke-width="2"/>
  <text x="155" y="438" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a41">4x4 Matrix Keypad</text>
  <text x="155" y="468" text-anchor="middle" font-size="14" fill="#1b2a41">R1, R2, R3, R4 → D2, D3, D4, D5</text>
  <text x="155" y="494" text-anchor="middle" font-size="14" fill="#1b2a41">C1, C2, C3 → D6, D7, D8</text>
  <text x="155" y="520" text-anchor="middle" font-size="14" fill="#1b2a41">C4 → A0</text>

  <!-- LCD -->
  <rect x="690" y="60" width="230" height="120" rx="10" fill="#e8f1ff" stroke="#0b5ed7" stroke-width="2"/>
  <text x="805" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a41">16x2 I2C LCD</text>
  <text x="805" y="116" text-anchor="middle" font-size="14" fill="#1b2a41">SDA → A4      SCL → A5</text>
  <text x="805" y="140" text-anchor="middle" font-size="14" fill="#1b2a41">VCC → 5V      GND → GND</text>

  <!-- Relay -->
  <rect x="690" y="250" width="230" height="100" rx="10" fill="#fff4e0" stroke="#d98200" stroke-width="2"/>
  <text x="805" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a41">Relay Module</text>
  <text x="805" y="306" text-anchor="middle" font-size="14" fill="#1b2a41">IN → A1</text>
  <text x="805" y="330" text-anchor="middle" font-size="14" fill="#1b2a41">VCC → 5V      GND → GND</text>

  <!-- Lock -->
  <rect x="690" y="440" width="230" height="120" rx="10" fill="#fdeaea" stroke="#c62828" stroke-width="2"/>
  <text x="805" y="468" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a41">Solenoid Lock (12V)</text>
  <text x="805" y="496" text-anchor="middle" font-size="14" fill="#1b2a41">12V (+) → Relay COM</text>
  <text x="805" y="518" text-anchor="middle" font-size="14" fill="#1b2a41">Relay NO → Lock (+)</text>
  <text x="805" y="540" text-anchor="middle" font-size="14" fill="#1b2a41">12V (−) → Lock (−)</text>

  <text x="480" y="596" text-anchor="middle" font-size="13" fill="#5b6b82">Power the RC522 from 3.3V. Connect all GND together. Add a 1N4007 diode across the lock terminals.</text>
</svg>
